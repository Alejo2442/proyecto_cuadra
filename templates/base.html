<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Cuadra{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="fondo-panel">
    <div class="layout">

        <aside class="sidebar">
            <div class="sidebar-marca">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" width="38" class="logo-sidebar">
                <span class="marca-sidebar">CUADRA</span>
            </div>

            <nav class="sidebar-menu">
                <a href="{{ url_for('usuarios.listar') }}" class="sidebar-link activo">
                    <i class="bi bi-people-fill"></i> Usuarios
                </a>
            </nav>

            <div class="sidebar-usuario">
                <div class="avatar-mini">{{ current_user.usuario[0]|upper }}</div>
                <span class="flex-grow-1 text-truncate">{{ current_user.usuario }}</span>
                <a href="{{ url_for('auth.logout') }}" class="btn-salir" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </aside>

        <main class="contenido">
            {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
                {% endfor %}
            {% endwith %}

            {% block contenido %}{% endblock %}
        </main>

    </div>
</body>
</html>
