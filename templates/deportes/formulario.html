{% extends "base.html" %}
{% block titulo %}Deportes | Cuadra{% endblock %}
{% block contenido %}
<div class="form-card">
    <h2 class="titulo-login">{{ 'Editar deporte' if deporte else 'Nuevo deporte' }}</h2>
    <form method="POST">
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="{{ nombre }}">
        </div>
        <div class="botones">
            <button type="submit" class="btn-cuadra">Guardar</button>
            <a href="{{ url_for('deportes.listar') }}" class="btn-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
