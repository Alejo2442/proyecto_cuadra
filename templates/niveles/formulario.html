{% extends "base.html" %}
{% block titulo %}Niveles | Cuadra{% endblock %}
{% block contenido %}
<div class="form-card">
    <h2 class="titulo-login">{{ 'Editar nivel' if nivel else 'Nuevo nivel' }}</h2>
    <form method="POST">
        <div class="campo">
            <label for="deporte_id">Deporte</label>
            <select name="deporte_id" id="deporte_id">
                <option value="">-- Selecciona un deporte --</option>
                {% for d in deportes %}
                <option value="{{ d.id }}" {{ 'selected' if d.id|string == datos.deporte_id|string }}>{{ d.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="{{ datos.nombre or '' }}">
        </div>
        <div class="campo">
            <label for="orden">Orden</label>
            <input type="number" id="orden" name="orden" value="{{ datos.orden or '' }}">
            <div class="ayuda">1 = el nivel más bajo del deporte.</div>
        </div>
        <div class="botones">
            <button type="submit" class="btn-cuadra">Guardar</button>
            <a href="{{ url_for('niveles.listar') }}" class="btn-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
