{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if usuario else 'Nuevo' }} usuario | Cuadra{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="titulo-login mb-4">{{ 'Editar usuario' if usuario else 'Nuevo usuario' }}</h2>

                <form method="POST">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" id="usuario" name="usuario" class="form-control"
                               value="{{ usuario.usuario if usuario else '' }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" class="form-control"
                               placeholder="{{ 'Déjala vacía para no cambiarla' if usuario else 'Ingresa una contraseña' }}"
                               {{ '' if usuario else 'required' }}>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-cuadra flex-fill">Guardar</button>
                        <a href="{{ url_for('usuarios.listar') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
