<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">

            <section id="presentacion" class="col-md-6 text-white vh-100 curva_inicio d-flex flex-column justify-content-center align-items-center">
                <h1 class="titulo-cuadra mb-0">CUADRA</h1>
                <p class="leyenda mt-2">Tú pones las ganas, nosotros cuadramos</p>
            </section>

            <section id="login" class="col-md-6 vh-100 d-flex flex-column justify-content-center align-items-center">

                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo de Cuadra" width="180" class="mb-3">

                <h2 class="titulo-login mb-4">Bienvenido</h2>

                {% with mensajes = get_flashed_messages(with_categories=true) %}
                    {% for categoria, mensaje in mensajes %}
                        <div class="alert alert-{{ categoria }} login-form py-2">{{ mensaje }}</div>
                    {% endfor %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" id="usuario" name="usuario" class="form-control form-control-lg" placeholder="Ingresa tu usuario" required>
                    </div>

                    <div class="mb-4">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" class="form-control form-control-lg" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-cuadra btn-lg w-100">Iniciar sesión</button>
                </form>

                <p class="mt-4 text-muted">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}" class="enlace-cuadra">Regístrate</a></p>

            </section>

        </div>
    </div>
</body>
</html>
