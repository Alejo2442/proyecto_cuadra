{% extends "base_acceso.html" %}
{% block contenido %}
<h2 class="titulo-login">Bienvenido</h2>

<div class="login-form">
    {% include "_mensajes.html" %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="campo campo-grande">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">
        </div>
        <div class="campo campo-grande">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña">
        </div>
        <button type="submit" class="btn-cuadra btn-ancho">Iniciar sesión</button>
    </form>
</div>

<p class="texto-suave">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}" class="enlace-cuadra">Regístrate</a></p>
{% endblock %}
